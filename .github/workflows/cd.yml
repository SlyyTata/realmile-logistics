name: CD

# Every merge to main: build both images, push them to Amazon ECR tagged with
# the commit SHA, then roll them out to ECS. AWS access uses OIDC (no stored keys),
# for both the ECR push and the ECS deploy.
#

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once, and never cancel one halfway through
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  API_SERVICE: ${{ vars.API_SERVICE }}
  API_TASK_FAMILY: ${{ vars.API_TASK_FAMILY }}
  API_CONTAINER: ${{ vars.API_CONTAINER }}
  MIGRATE_CONTAINER: ${{ vars.MIGRATE_CONTAINER }}
  API_REPOSITORY: ${{ vars.API_REPOSITORY }}
  WEB_SERVICE: ${{ vars.WEB_SERVICE }}
  WEB_TASK_FAMILY: ${{ vars.WEB_TASK_FAMILY }}
  WEB_CONTAINER: ${{ vars.WEB_CONTAINER }}
  WEB_REPOSITORY: ${{ vars.WEB_REPOSITORY }}
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

jobs:
  # Fail fast with a clear message instead of a confusing AWS error later
  check-config:
    name: Check configuration
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify required secrets and variables are set
        run: |
          missing=""
          for name in AWS_DEPLOY_ROLE_ARN AWS_REGION ECS_CLUSTER \
                      API_SERVICE API_TASK_FAMILY API_CONTAINER MIGRATE_CONTAINER API_REPOSITORY \
                      WEB_SERVICE WEB_TASK_FAMILY WEB_CONTAINER WEB_REPOSITORY NEXT_PUBLIC_API_URL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub variables:$missing"
            exit 1
          fi
          echo "All required configuration is set."

  publish:
    name: Publish ${{ matrix.name }} image
    needs: check-config
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC login to AWS, needed to push to ECR
      contents: read
    strategy:
      # I used a matrix because the API and web images go through exactly the same steps:
      # check out the code, set up Buildx, log in to ECR, then build and push.
      # Only a few values differ: the name, the repository, the folder and the build argument.
      # The matrix lets me write the steps once and run them for each image.
      matrix:
        include:
          - name: api
            repository: ${{ vars.API_REPOSITORY }}
            context: .
            build-args: ""
          - name: web
            repository: ${{ vars.WEB_REPOSITORY }}
            context: ./frontend
            # Browser calls the API on the same address; the ALB routes /api/* to it
            build-args: NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    # The deploy job starts here, but it doesn't run until the publish job has finished successfully for both images.
    name: Deploy to ECS
    needs: publish
    runs-on: ubuntu-latest
    # Note: no `environment:` here. Adding one changes the OIDC token subject to
    # repo:<repo>:environment:<name>, which the IAM role trust policy would reject.
    permissions:
      id-token: write   # lets the job request a GitHub OIDC token for AWS
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ECR image URIs look like <account>.dkr.ecr.<region>.amazonaws.com/<repo>:<tag>
      - name: Work out image URIs
        run: |
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "API_IMAGE=${REGISTRY}/${API_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${REGISTRY}/${WEB_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      # Start from the live task definitions (managed by Terraform) and only swap the image
      - name: Download current task definitions
        run: |
          aws ecs describe-task-definition --task-definition "$API_TASK_FAMILY" --query taskDefinition > api-td.json
          aws ecs describe-task-definition --task-definition "$WEB_TASK_FAMILY" --query taskDefinition > web-td.json

      # --- API: the migrate and api containers both run the API image ---
      - name: Render API task definition (migrate)
        id: api-migrate
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api-td.json
          container-name: ${{ env.MIGRATE_CONTAINER }}
          image: ${{ env.API_IMAGE }}

      - name: Render API task definition (api)
        id: api-td
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.api-migrate.outputs.task-definition }}
          container-name: ${{ env.API_CONTAINER }}
          image: ${{ env.API_IMAGE }}

      - name: Deploy API
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.api-td.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.API_SERVICE }}
          wait-for-service-stability: true

      # --- Web (after the API, so new frontend code never hits an old API) ---
      - name: Render web task definition
        id: web-td
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: web-td.json
          container-name: ${{ env.WEB_CONTAINER }}
          image: ${{ env.WEB_IMAGE }}

      - name: Deploy web
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.web-td.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.WEB_SERVICE }}
          wait-for-service-stability: true
